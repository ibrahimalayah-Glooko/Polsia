name: Integration

on:
  push:
    branches: [main]

env:
  CLAUDE_CLI_MOCK: "true"

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v -m integration

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Copy env file
        run: cp .env.example .env
      - name: Build and start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 5
          done
          echo "Backend did not become healthy in time" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
